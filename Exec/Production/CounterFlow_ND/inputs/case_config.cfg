# =============================================================================
# case_config.cfg — Shared case parameters for CounterFlow_ND
# =============================================================================
# Edit values here, then run:
#   python run_scripts/configure_inputs.py
#
# This propagates changes to ALL input files automatically.
#
# Sections:
#   [shared]  — written to ALL input files (local and HPC)
#   [local]   — written only to *_local input files  (quick local testing, no AMR)
#   [hpc]     — written only to HPC cluster input files (with AMR)
#
# Notes:
#   - Inline comments on existing lines are preserved when values are updated.
#   - Keys that don't appear in a given input file are silently skipped.
#   - Solver-specific settings (cvode.*, qss.*, adaptive.*, arkode.*) are NOT
#     managed here — edit those directly in the individual input files.
# =============================================================================

[shared]

# ── Physical conditions ──────────────────────────────────────────────────────
prob.P_mean              = 792897.5
prob.T_ox                = 450.0
prob.T_fuel              = 450.0
prob.T_inert             = 450.0
prob.Y_O2_ox             = 0.233
prob.Y_N2_ox             = 0.767
prob.Y_N2_fuel           = 0.0
prob.Y_fuel              = 1.0

# ── Flow rates (these set inlet velocities — keep consistent with inert_velocity_*) ──
prob.massflow_ox         = 0.9171
prob.massflow_fuel       = 2.228
prob.jet_radius          = 0.0025
prob.inert_velocity_ox   = 0.1500
prob.inert_velocity_fuel = 0.0617

# ── Ignition kernel ──────────────────────────────────────────────────────────
# SphT:   reduce from 2200 K to avoid low-Mach violation (high expansion velocities)
# SphRad: keep small; too large → supersonic expansion; too small → divU crash
prob.ignition_SphT       = 1000.0
prob.ignition_SphRad     = 0.0015

# ── AMR grid ─────────────────────────────────────────────────────────────────
amr.n_cell               = 64 64 32

# ── Time stepping ────────────────────────────────────────────────────────────
amr.cfl                  = 0.1
amr.dt_shrink            = 0.001
amr.init_dt              = 1.0e-8

# ── PeleLM numerics ──────────────────────────────────────────────────────────
peleLM.sdc_iterMax       = 2
peleLM.use_wbar          = 1
peleLM.floor_species     = 1

# ── ODE tolerances (shared across all chemistry integrators) ─────────────────
ode.rtol                 = 1.0e-6
ode.atol                 = 1.0e-5

# ── Projection solver tolerances ─────────────────────────────────────────────
mac_proj.rtol            = 1.0e-10
nodal_proj.rtol          = 1.0e-10


[local]
# Settings for *_local input files (single-machine, quick tests, no AMR).
# amr.stop_time and amr.plot_per are intentionally NOT here — they differ per
# solver (cold flow vs hot run) and should be managed per-file.

amr.max_level            = 0
amr.gradT.max_level      = 0
peleLM.v                 = 2


[hpc]
# Settings for HPC cluster input files (with AMR enabled).
# amr.stop_time and amr.plot_per are omitted — manage them per-file or use
# the --stop-time flag in submit_benchmark.py.

amr.max_level            = 2
amr.gradT.max_level      = 2
peleLM.v                 = 3
